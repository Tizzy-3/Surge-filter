name: Update filtered Surge module
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Fetch, filter and validate
        run: python filter_surge.py
      - name: Commit output if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blockAds-filtered.sgmodule filter-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update filtered Surge module'
            git push
          fi

